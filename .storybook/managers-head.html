<script>
  // Inject polyfills INLINE in HTML before any scripts run
  // This is executed BEFORE Storybook JS files even load

  (function () {
    class EventEmitter {
      constructor() {
        this._events = {};
      }
      on(e, l) {
        if (!this._events[e]) this._events[e] = [];
        this._events[e].push(l);
        return this;
      }
      off(e, l) {
        if (!this._events[e]) return this;
        this._events[e] = this._events[e].filter((x) => x !== l);
        return this;
      }
      emit(e, ...a) {
        if (!this._events[e]) return false;
        this._events[e].forEach((l) => {
          try {
            l(...a);
          } catch (err) {}
        });
        return true;
      }
      once(e, l) {
        const w = (...a) => {
          l(...a);
          this.off(e, w);
        };
        return this.on(e, w);
      }
      removeAllListeners(e) {
        e ? delete this._events[e] : (this._events = {});
        return this;
      }
      listeners(e) {
        return this._events[e] || [];
      }
      listenerCount(e) {
        return (this._events[e] || []).length;
      }
    }

    if (typeof globalThis !== 'undefined') globalThis.EventEmitter = EventEmitter;
    if (typeof window !== 'undefined') window.EventEmitter = EventEmitter;

    if (typeof globalThis !== 'undefined') {
      if (!globalThis.expo) {
        globalThis.expo = {};
      }
      if (!globalThis.expo.EventEmitter) {
        globalThis.expo.EventEmitter = EventEmitter;
      }
      if (!globalThis.expo.NativeModule) {
        globalThis.expo.NativeModule = class NativeModule {};
      }
      if (!globalThis.expo.SharedObject) {
        globalThis.expo.SharedObject = class SharedObject {};
      }
      if (!globalThis.expo.SharedRef) {
        globalThis.expo.SharedRef = class SharedRef {};
      }
      if (!globalThis.expo.modules) {
        globalThis.expo.modules = {};
      }
    }

    if (typeof globalThis !== 'undefined' && !globalThis.process) {
      globalThis.process = {
        env: { NODE_ENV: 'development' },
        nextTick:
          typeof queueMicrotask !== 'undefined'
            ? queueMicrotask
            : (cb) => Promise.resolve().then(cb),
      };
    }
  })();
</script>
