# Subflow: add_pizza.yaml
# Pizza Grande/Família: 1/2 Calabresa + 1/2 Chocolate com Morango + Bacon
# Requer: estar na tela Novo Pedido com o cardápio carregado
appId: com.comandapraia.donacida
---
- assertVisible:
    text: "Calabresa"

- tapOn:
    text: "Calabresa"
    index: 0

- assertVisible:
    text: "Grande/Família"

- tapOn:
    text: "Grande/Família"
    index: 0

- assertVisible:
    text: "Chocolate com Morango"

- tapOn:
    text: "Chocolate com Morango"
    index: 0

- assertVisible:
    text: "Próximo: Extras"

- tapOn:
    text: "Próximo: Extras"
    index: 0

- assertVisible:
    text: "Bacon"

- tapOn:
    text: "Bacon"
    index: 0

- tapOn:
    text: "Adicionar ao Pedido"
    index: 0

- assertVisible:
    text: "Pizza adicionada!"
