# Subflow: login.yaml
# Parâmetros obrigatórios: TEST_EMAIL, TEST_PASSWORD
# Chame via:
#   - runFlow:
#       file: _subflows/login.yaml
#       env:
#         TEST_EMAIL: ${PLAYWRIGHT_TEST_EMAIL}
#         TEST_PASSWORD: ${PLAYWRIGHT_TEST_PASSWORD}
---
- launchApp:
    clearState: true

- assertVisible:
    text: "seu@email.com"
    timeout: 15000

- tapOn: "seu@email.com"
- inputText: "${TEST_EMAIL}"

- tapOn: "••••••••"
- inputText: "${TEST_PASSWORD}"

- tapOn: "ENTRAR"

- assertVisible:
    text: "Novo Pedido"
    timeout: 15000
