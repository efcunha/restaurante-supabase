# Subflow: login_garcom02.yaml
# Variáveis lidas do ambiente: PLAYWRIGHT_TEST_EMAIL_GARCOM02, PLAYWRIGHT_TEST_PASSWORD_GARCOM02
# Defina em .maestro/.env.maestro ou passe via -e
appId: com.comandapraia.donacida
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
    id: "login-email-input"
    timeout: 15000

- tapOn:
  id: "login-email-input"
- inputText: "${PLAYWRIGHT_TEST_EMAIL_GARCOM02}"

- tapOn:
  id: "login-password-input"
- inputText: "${PLAYWRIGHT_TEST_PASSWORD_GARCOM02}"

- tapOn:
  id: "login-submit-button"

- extendedWaitUntil:
    visible:
      text: "Novo Pedido"
    timeout: 15000
