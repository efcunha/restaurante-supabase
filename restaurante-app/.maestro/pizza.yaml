# Equivalente a: restaurante-web/e2e/pizza.spec.ts
# Fluxo: Login Garcom 01 -> Novo Pedido -> Pizza + itens padrão (Balcão, sem mesa)
#
# Pré-requisito: .env.maestro com PLAYWRIGHT_TEST_EMAIL e PLAYWRIGHT_TEST_PASSWORD
# Execução: maestro test .maestro/pizza.yaml
appId: com.comandapraia.donacida
name: "Fluxo Pizza - Garcom 01"
env:
  PLAYWRIGHT_TEST_EMAIL: ""
  PLAYWRIGHT_TEST_PASSWORD: ""
---
# ── 1. Login ─────────────────────────────────────────────────────────────────
- runFlow:
    file: _subflows/login.yaml
    env:
      TEST_EMAIL: ${PLAYWRIGHT_TEST_EMAIL}
      TEST_PASSWORD: ${PLAYWRIGHT_TEST_PASSWORD}

# ── 2. Navega para Novo Pedido ────────────────────────────────────────────────
- tapOn: "Novo Pedido"
- assertVisible:
    text: "Digite o nome"
    timeout: 15000

# ── 3. Preenche nome do cliente ───────────────────────────────────────────────
- tapOn: "Digite o nome"
- inputText: "Pedido Pizza Maestro"

# ── 4. Configura Pizza Grande/Família (Calabresa + Chocolate com Morango + Bacon)
- runFlow: _subflows/add_pizza.yaml

# ── 5. Adiciona itens padrão (Chopp x3, Risoto x1, Caldo x3) ─────────────────
- runFlow: _subflows/add_itens_padrao.yaml

# ── 6. Cria pedido e valida toast de sucesso ──────────────────────────────────
- tapOn: "Criar Pedido"
- assertVisible:
    text: "Pedido criado! Comanda"
    timeout: 15000
