# SonarScanner config for restaurante-app (RN/Expo)
# Keep analysis focused on JS/TS and ignore native C-family files.
sonar.sources=src
sonar.tests=.
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

sonar.exclusions=android/**,ios/**,build/**,dist/**,coverage/**,node_modules/**,.expo/**

# Disable C/C++/Objective-C analysis (manual mode requires compile commands).
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-
