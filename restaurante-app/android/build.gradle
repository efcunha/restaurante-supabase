// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    // classpath('com.google.gms:google-services:4.4.4')

    constraints {
      classpath('io.netty:netty-codec-http:4.1.132.Final') {
        because 'Security hardening for Snyk-reported CVEs in Gradle classpath'
      }
      classpath('io.netty:netty-codec-http2:4.1.132.Final') {
        because 'Security hardening for Snyk-reported CVEs in Gradle classpath'
      }
      classpath('io.netty:netty-common:4.1.132.Final') {
        because 'Security hardening for Snyk-reported CVEs in Gradle classpath'
      }
      classpath('io.netty:netty-handler:4.1.132.Final') {
        because 'Security hardening for Snyk-reported CVEs in Gradle classpath'
      }
      classpath('com.google.protobuf:protobuf-java:3.25.5') {
        because 'Security hardening for CVE-2024-7254 in Gradle classpath'
      }
    }
  }

  configurations.classpath {
    resolutionStrategy.eachDependency { details ->
      if (details.requested.group == 'io.netty') {
        details.useVersion '4.1.132.Final'
        details.because 'Fix CVEs reported by Snyk in Gradle classpath transitive dependencies'
      }

      if (details.requested.group == 'com.google.protobuf' && details.requested.name == 'protobuf-java') {
        details.useVersion '3.25.5'
        details.because 'Fix CVE-2024-7254 reported by Snyk in Gradle classpath'
      }
    }
  }
}

// Force specific SDK versions to avoid issues with missing/unstable platforms
ext {
    buildToolsVersion = "35.0.0"
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    ndkVersion = "27.1.12297006" 
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
