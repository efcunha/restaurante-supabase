name: Storybook Figma Guardrails

on:
  pull_request:
    paths:
      - docs/design-system/**
      - restaurante-web/.storybook/**
      - restaurante-web/src/ui/**
      - restaurante-web/package.json
      - restaurante-web/package-lock.json
      - .github/workflows/storybook-figma-guardrails.yml
  push:
    branches: ["main"]
    paths:
      - docs/design-system/**
      - restaurante-web/.storybook/**
      - restaurante-web/src/ui/**
      - restaurante-web/package.json
      - restaurante-web/package-lock.json
      - .github/workflows/storybook-figma-guardrails.yml
  workflow_dispatch:
    inputs:
      storybook_base_url:
        description: "URL base publica do Storybook (opcional). Ex: https://storybook.exemplo.com"
        required: false
        type: string
      strict_public_docs_url:
        description: "Ativar validacao estrita (falha se docsUrl usar localhost/127.0.0.1)"
        required: false
        default: false
        type: boolean

jobs:
  validate-storybook-figma:
    name: Validate Storybook + Figma Map
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: restaurante-web/package-lock.json

      - name: Install restaurante-web dependencies
        working-directory: restaurante-web
        run: npm ci

      - name: Validate figma node map
        run: node docs/design-system/validate-figma-node-map.mjs

      - name: Apply public Storybook base URL (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.storybook_base_url != '' }}
        run: node docs/design-system/set-storybook-base-url.mjs "${{ inputs.storybook_base_url }}"

      - name: Validate figma node map (strict public docs URL)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.strict_public_docs_url == true }}
        env:
          REQUIRE_PUBLIC_DOCS_URL: "true"
        run: node docs/design-system/validate-figma-node-map.mjs

      - name: Build Storybook
        working-directory: restaurante-web
        run: npm run storybook:build -- --disable-telemetry
