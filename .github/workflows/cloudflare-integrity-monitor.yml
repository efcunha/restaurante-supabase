name: Cloudflare Integrity Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  integrity-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Cloudflare Integrity Check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_NAME: ${{ secrets.CLOUDFLARE_ZONE_NAME }}
          CLOUDFLARE_AUDIT_LOOKBACK_HOURS: ${{ secrets.CLOUDFLARE_AUDIT_LOOKBACK_HOURS }}
          CLOUDFLARE_ALLOWED_CNAMES: ${{ secrets.CLOUDFLARE_ALLOWED_CNAMES }}
          CLOUDFLARE_ALLOWED_WORKER_ROUTES: ${{ secrets.CLOUDFLARE_ALLOWED_WORKER_ROUTES }}
          CLOUDFLARE_ALLOWED_WORKER_SCRIPTS: ${{ secrets.CLOUDFLARE_ALLOWED_WORKER_SCRIPTS }}
        run: node scripts/security/cloudflare-integrity-check.mjs
